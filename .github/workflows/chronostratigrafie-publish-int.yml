name: Publish the new Chronostratigrafie RDF to GraphDB-INT public project

on:
  pull_request:
    types:
      - closed
  workflow_dispatch:

jobs:
  publish_gps:
    runs-on: ubuntu-latest

    if: "github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'"

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v3

      - name: Replace baseurl in RDF file to address INT environment
        run: |
          FILE_PATH="./chronostratigrafie.rdf"
          sed -i 's/dev-lexic.swissgeol.ch/int-lexic.swissgeol.ch/g' "$FILE_PATH"

      - name: Upload file via PUT to graphdb-gps
        env:
          FILE_PATH: ./chronostratigrafie.rdf # percorso del file che vuoi caricare
          PUT_URL: https://int-graphdbgps.swissgeol.ch/publish/chronostratigraphy_swisstopo_public_core?context=https://int-lexic.swissgeol.ch/Chronostratigraphy/
          TOKEN: ${{ secrets.LEXIC_CONTROLLED_VOCABULARIES_GRAPHDB_GPS_TOKEN }}
        run: |
          response=$(curl -w "%{http_code}" -X PUT -T $FILE_PATH -H "Authorization: Bearer $TOKEN" $PUT_URL -o response.txt)
          if [[ "$response" -ge 200 && "$response" -lt 300 ]]; then
            echo "Upload successful: HTTP $response"
          else
            echo "Upload failed: HTTP $response"
            exit 1
          fi
